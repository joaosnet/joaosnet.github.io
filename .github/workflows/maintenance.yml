name: Dependency & Lockfile Maintenance

on:
  schedule:
    - cron: "0 3 * * 1" # Weekly every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install uv
        run: python -m pip install uv==0.11.28

      - name: Upgrade lockfiles and dependencies
        run: |
          uv lock --upgrade
          uv sync --extra dev
          npm update

      - name: Audit security vulnerabilities
        run: |
          uv run pip-audit --local
          npm audit --audit-level=moderate

      - name: Run test suite
        run: |
          uv run ruff check build_site.py update_projects.py scripts/build_cv.py scripts/preview.py scripts/fetch_assets.py tests
          uv run pytest tests -q -p no:cacheprovider
          npm run test:syntax
          npm test

      - name: Create or update maintenance Pull Request
        uses: peter-evans/create-pull-request@271a8d0340265f70570b23d014849307873e2f37 # v7.0.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): weekly automated dependency & lockfile maintenance"
          branch: "automation/weekly-dependency-maintenance"
          delete-branch: true
          title: "chore(deps): weekly automated dependency & lockfile maintenance"
          body: |
            ## Automated Dependency & Lockfile Maintenance

            This PR was automatically generated by the weekly maintenance workflow.
            
            - Upgraded Python transitive and direct dependencies via `uv lock --upgrade`.
            - Upgraded Node dependencies via `npm update`.
            - Audited all dependencies with `pip-audit` and `npm audit` (0 vulnerabilities found).
            - Successfully validated unit tests, linting, and syntax checks.
          labels: |
            dependencies
            automated-maintenance
