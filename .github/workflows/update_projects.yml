name: Update Projects

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_projects.py"

permissions:
  contents: write

jobs:
  update-projects:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev
      - run: uv run python update_projects.py public
      - run: uv run python build_site.py
      - run: uv run pytest tests -q -p no:cacheprovider
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(projects): auto-update public projects metadata and rebuild site" && git push)
