name: Update Projects

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "update_projects.py"

permissions:
  contents: write

jobs:
  update-projects:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev
      - run: uv run python update_projects.py public
      - run: uv run python build_site.py
      - run: uv run pytest tests -q -p no:cacheprovider
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(projects): auto-update public projects metadata and rebuild site" && git push)
