name: Validate portfolio
on:
  push:
    branches: [main, feat/portfolio-excellence]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev
      - run: npm ci --ignore-scripts
      - run: uv run ruff check build_site.py update_projects.py scripts/build_cv.py scripts/preview.py scripts/fetch_assets.py tests
      - run: uv run pytest tests -q -p no:cacheprovider
      - run: npm run test:syntax
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
      - run: uv run pip-audit --local
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portfolio-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3
