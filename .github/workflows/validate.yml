name: Validate portfolio
on:
  push:
    branches: [main, feat/portfolio-excellence]
  pull_request:
  workflow_call:
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            python:
              - 'pyproject.toml'
              - 'uv.lock'
              - '**/*.py'
              - 'tests/test_*.py'
              - '.github/workflows/validate.yml'
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'assets/js/**'
              - 'tests/collector.test.cjs'
              - '.github/workflows/validate.yml'
            browser:
              - 'package.json'
              - 'package-lock.json'
              - 'assets/**'
              - 'index.html'
              - 'build_site.py'
              - 'tests/browser/**'
              - 'playwright.config.*'
              - '.github/workflows/validate.yml'

  validate-python:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check build_site.py update_projects.py scripts/build_cv.py scripts/preview.py scripts/fetch_assets.py tests
      - run: uv run pytest tests -q -p no:cacheprovider
      - run: uv run pip-audit --local

  validate-node:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:syntax
      - run: npm test
      - run: npm audit --audit-level=moderate

  validate-browser:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install uv==0.11.28
      - run: uv sync --frozen --extra dev
      - run: uv run python build_site.py
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-preview
          path: dist/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 3

  validate:
    needs: [validate-python, validate-node, validate-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate status check
        run: |
          python_status="${{ needs.validate-python.result }}"
          node_status="${{ needs.validate-node.result }}"
          browser_status="${{ needs.validate-browser.result }}"

          echo "Status: Python=$python_status, Node=$node_status, Browser=$browser_status"

          for status in "$python_status" "$node_status" "$browser_status"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "Error: Validation job failed with status $status."
              exit 1
            fi
          done
          echo "All applicable validation jobs succeeded or were cleanly skipped."
