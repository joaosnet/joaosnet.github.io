[project]
name = "joaosnet-portfolio"
version = "0.1.0"
description = "Portfolio website with automated project updates from GitHub"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.0,<3",
    "Pillow>=11,<13",
    "Jinja2>=3.1.6,<4",
    "reportlab>=4.4,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pypdf>=6,<7",
    "pymupdf>=1.26,<2",
    "pip-audit>=2.9,<3",
    "ruff>=0.15,<1",
]

[project.scripts]
update-projects = "update_projects:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
