{% extends 'base.html' %}{% block title %}404 | {{ site.name }}{% endblock %}{% block content %}<section class="container not-found not-found-controller"><p class="eyebrow">404 / NOT FOUND</p><h1 class="not-found-heading" data-lang-pt="Essa página saiu do circuito." data-lang-en="This page went off the circuit." data-lang-es="Esta página salió del circuito.">{{ t.not_found }}</h1><p class="not-found-desc" data-lang-pt="O endereço pode ter mudado. Os projetos e o laboratório continuam por aqui." data-lang-en="The address may have changed. The projects and lab are still here." data-lang-es="La dirección puede haber cambiado. Los proyectos y el laboratorio siguen aquí.">{{ t.not_found_text }}</p><a class="button primary not-found-home-btn" href="{{ base }}" data-lang-pt="Início →" data-lang-en="Home →" data-lang-es="Inicio →">{{ t.home }} →</a><a class="text-link not-found-lang-link" href="{{ alternates.pt if lang != 'pt' else alternates.en }}" lang="{{ 'pt-BR' if lang != 'pt' else 'en' }}">{{ 'Português' if lang != 'pt' else 'English' }} →</a>{% if lang != 'es' %}<a class="text-link not-found-es-link" href="{{ alternates.es }}" lang="es">Español →</a>{% endif %}</section>{% endblock %}
